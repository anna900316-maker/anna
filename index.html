<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#f6edf9"/><meta name="apple-mobile-web-app-capable" content="yes"/><title>Tokyo Travel Book</title><style>:root{--ink:#37334c;--muted:#817b97;--pink:#ffe4f0;--purple:#e9e2ff;--blue:#dff2ff;--paper:rgba(255,255,255,.78);--line:#ebe6f2;--accent:#8b6ec7;--danger:#c66f86}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 4%,#fff 0 8%,transparent 31%),linear-gradient(145deg,#fff6fb,#f6f3ff 45%,#ecf9ff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.shell{width:min(100%,760px);margin:auto;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom))}.hero{min-height:300px;padding:43px 28px 26px;border-radius:0 0 36px 36px;background:linear-gradient(130deg,rgba(255,219,237,.78),rgba(227,218,255,.76),rgba(215,242,255,.78));margin:0 -16px 22px;position:relative;overflow:hidden}.hero:after{content:"✦  ✧  ☾";position:absolute;right:20px;top:19px;font-size:20px;color:#fff;letter-spacing:10px}.eyebrow{letter-spacing:3px;font-size:11px;color:#786b98;font-weight:700}.hero h1{font-family:Georgia,serif;font-size:64px;line-height:.95;margin:18px 0 12px;letter-spacing:4px}.hero-date{font-family:Georgia,serif;letter-spacing:1px;font-size:19px}.hero-days{margin-top:9px;color:#655b7c;font-size:13px;letter-spacing:2px}.edit-hero{position:absolute;right:24px;bottom:22px}.topbar{display:flex;align-items:center;justify-content:space-between;margin:5px 0 16px}.topbar h2{font-family:Georgia,serif;margin:0;font-size:27px}.card{background:var(--paper);border:1px solid rgba(255,255,255,.95);box-shadow:0 8px 25px rgba(105,90,142,.08);border-radius:22px;padding:16px;margin-bottom:12px;backdrop-filter:blur(8px)}.day-head{display:flex;align-items:center;gap:10px}.day-no{font-size:11px;letter-spacing:1.2px;color:#9178b5;font-weight:800}.day-date{font-size:12px;color:var(--muted);margin-left:auto}.day-title{font-family:Georgia,serif;font-size:20px;margin:6px 0 3px}.day-tools{display:flex;gap:7px;margin-top:13px}.entry{display:grid;grid-template-columns:58px 1fr 28px;gap:9px;padding:13px 0;border-top:1px solid var(--line);align-items:start}.entry-time{font-weight:700;font-size:13px;color:#726589}.entry-name{font-size:15px;font-weight:650;line-height:1.35}.entry-note{font-size:12px;color:var(--muted);margin-top:3px}.badge{display:inline-block;font-size:10px;color:#8154a7;background:#f2e4ff;padding:3px 7px;border-radius:20px;margin-top:5px}.badge.booked{background:#fff0c9;color:#8e6910}.drag{color:#b1a9c3;font-size:20px;text-align:center;cursor:grab}.button,.icon-btn{border:0;background:#fff;color:#665d75;font:inherit;border-radius:14px;min-height:39px;padding:0 13px;cursor:pointer;box-shadow:0 3px 10px rgba(93,75,130,.08)}.button.primary{background:#8870bd;color:white}.button.soft{background:#f1edff;color:#705d9f}.icon-btn{padding:0;width:39px}.section-title{margin:25px 3px 11px;font-family:Georgia,serif;font-size:22px}.section-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav-card{border:0;text-align:left;min-height:100px;padding:15px;border-radius:21px;background:var(--paper);font:inherit;color:var(--ink);box-shadow:0 7px 18px rgba(103,86,142,.08);cursor:pointer}.nav-card:nth-child(3n+1){background:#fff0f6}.nav-card:nth-child(3n+2){background:#f1efff}.nav-card:nth-child(3n){background:#eaf8ff}.nav-icon{font-size:23px;display:block;margin-bottom:10px}.nav-card small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.bottom-nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.88);border-top:1px solid #eee8f5;display:flex;justify-content:space-around;backdrop-filter:blur(12px)}.bottom-nav button{border:0;background:transparent;font:inherit;color:#827a91;padding:5px 8px;cursor:pointer}.bottom-nav button.active{color:#7654a8;font-weight:750}.back{display:flex;align-items:center;gap:10px;margin-bottom:16px}.detail-head{padding:25px 4px 14px}.detail-head h1{font-family:Georgia,serif;font-size:32px;margin:8px 0}.empty{color:var(--muted);text-align:center;padding:25px;font-size:14px}.modal-wrap{position:fixed;inset:0;z-index:10;background:rgba(48,40,69,.22);display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{width:min(100%,560px);max-height:92vh;overflow:auto;background:#fffdfd;border-radius:28px;padding:23px;box-shadow:0 18px 60px rgba(38,28,64,.24)}.modal h3{font-family:Georgia,serif;font-size:24px;margin:0 0 17px}.field{display:block;font-size:12px;color:#726d80;margin:12px 0}.field input,.field textarea,.field select{display:block;width:100%;border:1px solid #e8e1ee;background:#fdfbff;border-radius:12px;padding:11px;margin-top:5px;font:inherit;color:var(--ink)}.field textarea{min-height:75px;resize:vertical}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.list-item{display:flex;gap:12px;align-items:center}.list-item .copy{flex:1}.list-item strong{display:block;font-size:15px}.list-item span{font-size:12px;color:var(--muted);display:block;margin-top:4px}.check{width:22px;height:22px;accent-color:#a380d4}#toast{position:fixed;z-index:99;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#473a5f;color:white;padding:9px 14px;border-radius:20px;font-size:13px;transition:.25s;pointer-events:none}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:700px){.shell{padding-left:28px;padding-right:28px}.hero{margin-left:-28px;margin-right:-28px}.modal-wrap{align-items:center}.section-nav{grid-template-columns:repeat(3,1fr)}}
.logout-button{display:block;text-align:center;text-decoration:none;margin-top:18px}.overview-list{display:grid;gap:8px}.overview-row{border:0;background:var(--paper);border-radius:16px;padding:12px;text-align:left;color:var(--ink);display:grid;grid-template-columns:70px 1fr;gap:3px;font:inherit}.overview-row span{font-size:11px;color:#8a79a8;font-weight:700}.overview-row span small{display:block;color:var(--muted);font-weight:400}.overview-row strong{font-size:14px}.overview-row em{grid-column:2;color:var(--muted);font-size:11px;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal-order{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:12px;color:var(--muted)}.qr-preview{width:110px;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.packing-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.packing-grid h3{font-family:Georgia,serif;margin:2px 0 11px}.packing-item{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:9px 0;font-size:14px}.packing-item small{display:block;color:var(--muted);font-size:10px}</style></head><body><main id="app" aria-live="polite"></main><div id="toast" role="status"></div><script>const KEY='tokyo-travel-book-v1';
const routes={tickets:['🎟️','預約／票券','管理預約、票券與確認碼'],restaurants:['🍡','餐廳','想吃的店與訂位備註'],shopping:['🛍️','購物清單','旅行中想買的東西'],transport:['🚃','交通資訊','班次、路線與交通卡'],expenses:['💴','旅費紀錄','共同旅行花費'],prep:['🧳','行前準備','出發前的待辦事項']};
const plan=[['09/05','DAY 01','羽田機場','羽田機場附近住宿'],['09/06','DAY 02','川崎','橫濱港未來','Cosmo World','紅磚倉庫','山下公園'],['09/07','DAY 03','淺草','秋葉原','東京迪士尼飯店'],['09/08','DAY 04','Tokyo DisneySea'],['09/09','DAY 05','澀谷','Shibuya Sky','新宿'],['09/10','DAY 06','吉卜力美術館','吉祥寺','晴空塔'],['09/11','DAY 07','哈利波特影城','池袋','東京鐵塔'],['09/12','DAY 08','明治神宮','原宿','表參道','麻布台之丘'],['09/13','DAY 09','自由逛街'],['09/14','DAY 10','東京','羽田機場','台灣']];
const id=()=>Math.random().toString(36).slice(2,10);
function initial(){return {hero:{city:'TOKYO',date:'2026.09.05–09.14',days:'10 DAYS IN TOKYO'},days:plan.map((p,i)=>({id:id(),date:p[0],title:p[1],transport:'',items:p.slice(2).map((name,n)=>({id:id(),time:'',name,note:'',transport:'',type:'景點',booked:(i===4&&name==='Shibuya Sky')||(i===5&&name==='吉卜力美術館')||(i===6&&name==='哈利波特影城')}))})),sections:{tickets:[],restaurants:[],shopping:[],transport:[],expenses:[],prep:[]}}}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()};
if(!Array.isArray(data.packing)) data.packing=[];
// Fixed bookings are inserted once for a useful first visit.
if(!localStorage.getItem(KEY)){data.days[4].items.find(x=>x.name==='Shibuya Sky').time='16:20–16:39';data.days[5].items.find(x=>x.name==='吉卜力美術館').time='10:00';data.days[6].items.find(x=>x.name==='哈利波特影城').time='10:30';data.sections.tickets=[{id:id(),title:'Shibuya Sky',detail:'09/09 16:20–16:39｜⭐ 已預約'},{id:id(),title:'吉卜力美術館',detail:'09/10 10:00｜⭐ 已預約'},{id:id(),title:'哈利波特影城',detail:'09/11 10:30｜⭐ 已預約'}];save()}
let view='home', modal=null, dragging=null;
const app=document.querySelector('#app');
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function nav(){return `<nav class="bottom-nav"><button class="${view==='home'?'active':''}" data-nav="home">⌂<br>首頁</button><button class="${view==='days'?'active':''}" data-nav="days">☷<br>行程</button><button class="${view==='more'?'active':''}" data-nav="more">✦<br>更多</button></nav>`}
function entry(day,item,index){return `<article class="entry" data-day="${day.id}" data-item="${item.id}"><button class="entry-time" data-edit-item="${day.id}:${item.id}" aria-label="設定 ${esc(item.name)} 的時間">${esc(item.time||'＋ 時間')}</button><button class="entry-body" data-edit-item="${day.id}:${item.id}" aria-label="編輯 ${esc(item.name)}"><span class="entry-name">${esc(item.name)}</span>${item.note?`<span class="entry-note">${esc(item.note)}</span>`:''}${item.transport?`<span class="entry-note transport-note">🚃 ${esc(item.transport)}</span>`:''}<span class="badge ${item.booked?'booked':''}">${item.booked?'⭐ 已預約':esc(item.type)}</span></button></article>`}
function dayCard(d,i){return `<section class="card"><div class="day-head"><div><div class="day-no">DAY ${String(i+1).padStart(2,'0')}</div><div class="day-title">${esc(d.title)}</div></div><div class="day-date">${esc(d.date)}</div><button class="icon-btn" data-edit-day="${d.id}">✎</button></div>${d.transport?`<div class="transport-line">🚃 ${esc(d.transport)}</div>`:''}<div class="items">${d.items.length?d.items.map((x,n)=>entry(d,x,n)).join(''):'<div class="empty">還沒有安排，加入第一個行程吧。</div>'}</div><div class="day-tools"><button class="button soft" data-add-item="${d.id}">＋ 加入行程</button></div></section>`}
function home(){return `<div class="shell"><header class="hero"><div class="eyebrow">TRAVEL BOOK</div><h1>${esc(data.hero.city)}</h1><div class="hero-date">${esc(data.hero.date)}</div><div class="hero-days">${esc(data.hero.days)}</div><button class="button edit-hero" data-hero aria-label="編輯首頁資訊" title="編輯首頁資訊">✎</button></header><div class="topbar"><h2>十日行程總覽</h2><button class="button soft" data-nav="days">詳細行程</button></div><div class="overview-list">${data.days.map((d,i)=>`<button class="overview-row" data-edit-day="${d.id}"><span>DAY ${String(i+1).padStart(2,'0')}<small>${esc(d.date)}</small></span><strong>${esc(d.title)}</strong><em>${esc(d.items.map(x=>x.name).join(' · ')||'點此編輯')}</em></button>`).join('')}</div><h2 class="section-title">旅行小工具</h2><div class="section-nav">${Object.entries(routes).map(([k,v])=>`<button class="nav-card" data-section="${k}"><span class="nav-icon">${v[0]}</span>${v[1]}<small>${v[2]}</small></button>`).join('')}</div></div>${nav()}`}
function days(){return `<div class="shell"><div class="detail-head"><div class="eyebrow">${esc(data.hero.date)}</div><h1>東京的每一天</h1><div style="color:var(--muted);font-size:13px">長按並拖曳行程可調整順序</div></div>${data.days.map(dayCard).join('')}</div>${nav()}`}
function more(){return `<div class="shell"><div class="detail-head"><div class="eyebrow">TOKYO TRAVEL BOOK</div><h1>旅行資料夾</h1></div><div class="section-nav">${Object.entries(routes).map(([k,v])=>`<button class="nav-card" data-section="${k}"><span class="nav-icon">${v[0]}</span>${v[1]}<small>${v[2]}</small></button>`).join('')}</div><a class="button logout-button" href="/_auth/logout">登出／取消信任此裝置</a></div>${nav()}`}
function section(key){if(key==='transport')return transportPage();if(key==='prep')return prepPage();const [icon,title,desc]=routes[key], list=data.sections[key];return `<div class="shell"><div class="back"><button class="icon-btn" data-nav="more">‹</button><div><div class="eyebrow">TOKYO 2026</div><h1 style="margin:2px 0;font-family:Georgia,serif">${icon} ${title}</h1></div></div><p style="font-size:13px;color:var(--muted);margin:0 0 16px">${desc}</p><button class="button primary" data-add-section="${key}">＋ 新增項目</button><div style="margin-top:12px">${list.length?list.map(x=>`<section class="card list-item"><div class="copy"><strong>${esc(x.title)}</strong>${x.detail?`<span>${esc(x.detail)}</span>`:''}</div><button class="icon-btn" data-edit-section="${key}:${x.id}">✎</button></section>`).join(''):'<div class="empty">還沒有項目。建立第一筆資料吧。</div>'}</div></div>${nav()}`}
function transportPage(){return `<div class="shell"><div class="back"><button class="icon-btn" data-nav="more">‹</button><div><div class="eyebrow">TOKYO 2026</div><h1 style="margin:2px 0;font-family:Georgia,serif">🚃 每日交通</h1></div></div><p class="entry-note">在每日行程或行程項目中填寫的交通資訊，會自動整理在這裡。</p>${data.days.map((d,i)=>`<section class="card"><div class="day-head"><div><div class="day-no">DAY ${String(i+1).padStart(2,'0')} · ${esc(d.date)}</div><div class="day-title">${esc(d.title)}</div></div><button class="icon-btn" data-edit-day="${d.id}">✎</button></div><div class="transport-line">${d.transport?esc(d.transport):'尚未填寫當日交通'}</div>${d.items.filter(x=>x.transport).map(x=>`<div class="entry-note transport-note">${esc(x.name)}：${esc(x.transport)}</div>`).join('')}</section>`).join('')}</div>${nav()}`}
function prepPage(){return `<div class="shell"><div class="back"><button class="icon-btn" data-nav="more">‹</button><div><div class="eyebrow">TOKYO 2026</div><h1 style="margin:2px 0;font-family:Georgia,serif">🧳 行前準備</h1></div></div><button class="nav-card" style="width:100%" data-packing><span class="nav-icon">🧺</span>打包清單<small>安娜＆阿彤的旅行必備物品</small></button><h2 class="section-title">其他待辦</h2><button class="button primary" data-add-section="prep">＋ 新增待辦</button><div style="margin-top:12px">${data.sections.prep.length?data.sections.prep.map(x=>`<section class="card list-item"><input class="check" type="checkbox" ${x.done?'checked':''} data-check="${x.id}" data-key="prep"><div class="copy"><strong>${esc(x.title)}</strong>${x.detail?`<span>${esc(x.detail)}</span>`:''}</div><button class="icon-btn" data-edit-section="prep:${x.id}">✎</button></section>`).join(''):'<div class="empty">還沒有待辦事項。</div>'}</div></div>${nav()}`}
function packingPage(){const col=owner=>data.packing.filter(x=>x.owners.includes(owner)).map(x=>`<div class="packing-item"><span>${esc(x.title)}<small>${esc(x.luggage||'隨身行李')}</small></span><button class="icon-btn" data-edit-packing="${x.id}">✎</button></div>`).join('')||'<div class="empty">尚未加入物品</div>';return `<div class="shell"><div class="back"><button class="icon-btn" data-section="prep">‹</button><div><div class="eyebrow">TRAVEL ESSENTIALS</div><h1 style="margin:2px 0;font-family:Georgia,serif">🧺 打包清單</h1></div></div><button class="button primary" data-add-packing>＋ 新增物品</button><div class="packing-grid"><section class="card"><h3>安娜</h3>${col('anna')}</section><section class="card"><h3>阿彤</h3>${col('tong')}</section></div></div>${nav()}`}
function render(){app.innerHTML=view==='home'?home():view==='days'?days():view==='more'?more():view==='packing'?packingPage():section(view);if(modal)app.insertAdjacentHTML('beforeend',modalHTML())}
function modalHTML(){
  const m=modal;
  if(m.type==='hero') return form('編輯旅程',`<label class="field">城市名稱<input name="city" value="${esc(data.hero.city)}"></label><label class="field">日期<input name="date" value="${esc(data.hero.date)}"></label><label class="field">副標題<input name="days" value="${esc(data.hero.days)}"></label>`);
  if(m.type==='day'){const d=data.days.find(x=>x.id===m.day);return form('編輯這一天',`<label class="field">日期<input name="date" value="${esc(d.date)}"></label><label class="field">標題<input name="title" value="${esc(d.title)}"></label><label class="field">🚃 交通資訊<textarea name="transport" placeholder="例如：淺草站 → 銀座線 → 澀谷站；使用 Suica">${esc(d.transport||'')}</textarea></label>`,true)}
  if(m.type==='item'){const d=data.days.find(x=>x.id===m.day),x=d.items.find(x=>x.id===m.item)||{time:'',name:'',note:'',transport:'',type:'景點',booked:false},pos=d.items.findIndex(a=>a.id===x.id);return form(m.item?'編輯行程':'新增行程',`<label class="field">時間<input name="time" placeholder="例如 10:00" value="${esc(x.time)}"></label><label class="field">名稱<input name="name" required value="${esc(x.name)}"></label><label class="field">備註<textarea name="note">${esc(x.note)}</textarea></label><label class="field">🚃 交通資訊<textarea name="transport" placeholder="例如：搭銀座線至淺草站 1 號出口">${esc(x.transport||'')}</textarea></label><label class="field">類型<select name="type">${['景點','餐廳','購物','交通','住宿','其他'].map(v=>`<option ${x.type===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><input type="checkbox" name="booked" ${x.booked?'checked':''}> ⭐ 已預約</label>${m.item?`<div class="modal-order"><span>調整順序</span><button type="button" class="button soft" data-modal-move="-1" ${pos===0?'disabled':''}>↑ 上移</button><button type="button" class="button soft" data-modal-move="1" ${pos===d.items.length-1?'disabled':''}>↓ 下移</button></div>`:''}`,!!m.item)}
  if(m.type==='section'){const x=data.sections[m.key].find(x=>x.id===m.item)||{title:'',detail:''};if(m.key==='tickets')return form(m.item?'編輯票券／預約':'新增票券／預約',`<label class="field">名稱<input name="title" required value="${esc(x.title)}"></label><label class="field">日期、時間或備註<textarea name="detail">${esc(x.detail)}</textarea></label><label class="field">安娜的 QR 票券照片<input type="file" name="annaQR" accept="image/*"></label>${x.annaQR?`<img class="qr-preview" src="${x.annaQR}" alt="安娜票券">`:''}<label class="field">阿彤的 QR 票券照片<input type="file" name="tongQR" accept="image/*"></label>${x.tongQR?`<img class="qr-preview" src="${x.tongQR}" alt="阿彤票券">`:''}`,!!m.item);return form(m.item?'編輯項目':'新增項目',`<label class="field">名稱<input name="title" required value="${esc(x.title)}"></label><label class="field">備註／詳細內容<textarea name="detail">${esc(x.detail)}</textarea></label>${m.key==='prep'?`<label class="field"><input type="checkbox" name="done" ${x.done?'checked':''}> 已完成</label>`:''}`,!!m.item)}
  if(m.type==='packing'){const x=data.packing.find(x=>x.id===m.item)||{title:'',owners:[],luggage:'隨身行李'};return form(m.item?'編輯物品':'新增物品',`<label class="field">物品名稱<input name="title" required value="${esc(x.title)}"></label><label class="field">放置位置<select name="luggage"><option ${x.luggage==='托運行李'?'selected':''}>托運行李</option><option ${x.luggage==='隨身行李'?'selected':''}>隨身行李</option></select></label><label class="field"><input type="checkbox" name="both" ${x.owners.includes('anna')&&x.owners.includes('tong')?'checked':''}> 兩人都帶</label><label class="field"><input type="checkbox" name="anna" ${x.owners.includes('anna')?'checked':''}> 安娜要帶</label><label class="field"><input type="checkbox" name="tong" ${x.owners.includes('tong')?'checked':''}> 阿彤要帶</label>`,!!m.item)}
}
function form(title,body,del=false){return `<div class="modal-wrap"><form class="modal" id="editForm"><h3>${title}</h3>${body}<div class="modal-actions">${del?'<button type="button" class="button" style="color:var(--danger)" data-delete>刪除</button>':''}<button type="button" class="button" data-cancel>取消</button><button class="button primary">儲存</button></div></form></div>`}
const readPhoto=file=>new Promise(resolve=>{if(!file)return resolve(null);const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)});
async function submit(f){let v=Object.fromEntries(new FormData(f));v.booked=f.booked?.checked||false;v.done=f.done?.checked||false;if(modal.type==='hero')Object.assign(data.hero,v);if(modal.type==='day'){Object.assign(data.days.find(x=>x.id===modal.day),v)}if(modal.type==='item'){let d=data.days.find(x=>x.id===modal.day),x=d.items.find(x=>x.id===modal.item);if(x)Object.assign(x,v);else d.items.push({id:id(),...v})}if(modal.type==='section'){let a=data.sections[modal.key],x=a.find(x=>x.id===modal.item);if(x)Object.assign(x,v);else{x={id:id(),...v};a.push(x)}if(modal.key==='tickets'){const anna=await readPhoto(f.annaQR?.files[0]),tong=await readPhoto(f.tongQR?.files[0]);if(anna)x.annaQR=anna;if(tong)x.tongQR=tong}}if(modal.type==='packing'){let x=data.packing.find(x=>x.id===modal.item),p={title:v.title,luggage:v.luggage,owners:f.both?.checked?['anna','tong']:[f.anna?.checked&&'anna',f.tong?.checked&&'tong'].filter(Boolean)};if(x)Object.assign(x,p);else data.packing.push({id:id(),...p})}save();modal=null;render();toast('已儲存')}
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.nav){view=b.dataset.nav;render()}if('hero' in b.dataset){modal={type:'hero'};render()}if(b.dataset.editDay){modal={type:'day',day:b.dataset.editDay};render()}if(b.dataset.addItem){modal={type:'item',day:b.dataset.addItem};render()}if(b.dataset.editItem){let [day,item]=b.dataset.editItem.split(':');modal={type:'item',day,item};render()}if(b.dataset.modalMove){let d=data.days.find(x=>x.id===modal.day),from=d.items.findIndex(x=>x.id===modal.item),to=from+Number(b.dataset.modalMove);if(to>=0&&to<d.items.length){d.items.splice(to,0,d.items.splice(from,1)[0]);save();render()}}if(b.dataset.section){view=b.dataset.section;render()}if('packing' in b.dataset){view='packing';render()}if('addPacking' in b.dataset){modal={type:'packing'};render()}if(b.dataset.editPacking){modal={type:'packing',item:b.dataset.editPacking};render()}if(b.dataset.addSection){modal={type:'section',key:b.dataset.addSection};render()}if(b.dataset.editSection){let [key,item]=b.dataset.editSection.split(':');modal={type:'section',key,item};render()}if('cancel' in b.dataset){modal=null;render()}if('delete' in b.dataset){if(modal.type==='day')data.days=data.days.filter(x=>x.id!==modal.day);if(modal.type==='item'){let d=data.days.find(x=>x.id===modal.day);d.items=d.items.filter(x=>x.id!==modal.item)}if(modal.type==='section')data.sections[modal.key]=data.sections[modal.key].filter(x=>x.id!==modal.item);if(modal.type==='packing')data.packing=data.packing.filter(x=>x.id!==modal.item);save();modal=null;render();toast('已刪除')}});
app.addEventListener('submit',e=>{if(e.target.id==='editForm'){e.preventDefault();submit(e.target)}});
app.addEventListener('change',e=>{if(e.target.dataset.check){let x=data.sections[e.target.dataset.key].find(x=>x.id===e.target.dataset.check);x.done=e.target.checked;save();toast('已更新')}});
app.addEventListener('dragstart',e=>{let el=e.target.closest('.entry');if(el)dragging=el});app.addEventListener('dragover',e=>{if(e.target.closest('.items'))e.preventDefault()});app.addEventListener('drop',e=>{let target=e.target.closest('.entry');if(!dragging||!target||dragging===target)return;let day=data.days.find(x=>x.id===dragging.dataset.day);if(day.id!==target.dataset.day)return;let a=day.items,from=a.findIndex(x=>x.id===dragging.dataset.item),to=a.findIndex(x=>x.id===target.dataset.item);a.splice(to,0,a.splice(from,1)[0]);save();render();toast('行程順序已更新')});
render();
</script></body></html>
